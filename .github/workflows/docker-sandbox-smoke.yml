name: Docker sandbox smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Alpha and pin a Docker image
        run: |
          python -m pip install -e .
          docker pull python:3.14-alpine
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          image = subprocess.check_output(
              ["docker", "image", "inspect", "python:3.14-alpine",
               "--format", "{{index .RepoDigests 0}}"], text=True).strip()
          policy = {
              "mode": "docker",
              "image": image,
              "network": "none",
              "memory_mb": 128,
              "cpus": 1,
              "pids_limit": 32,
              "timeout_seconds": 30,
              "max_output_kb": 256,
          }
          Path(os.environ["RUNNER_TEMP"], "sandbox-policy.json").write_text(json.dumps(policy))
          PY
      - name: Run a real isolated agent and verify cleanup
        run: |
          alpha orch run "Docker smoke test" \
            --command "python -c 'import json,os,socket,sys; req=json.load(sys.stdin); assert os.geteuid()==65534; assert os.statvfs(\"/\").f_flag & os.ST_RDONLY; assert not os.path.exists(\"/var/run/docker.sock\"); assert socket.socket().connect_ex((\"1.1.1.1\",80)) != 0; print(json.dumps({\"action\":\"complete\",\"result\":\"sandbox-ok\",\"children\":[]}))'" \
            --sandbox-policy "$RUNNER_TEMP/sandbox-policy.json" \
            --db "$RUNNER_TEMP/success.sqlite" --workers 1 > "$RUNNER_TEMP/success.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "success.json").read_text())
          assert result["state"] == "done", result
          assert result["result"] == "sandbox-ok", result
          PY
          test -z "$(docker ps -aq --filter label=alpha.sandbox=agent-command)"
      - name: Failed commands require review and leave no containers
        run: |
          set +e
          alpha orch run "Fail safely" \
            --command "python -c 'import sys; sys.exit(7)'" \
            --sandbox-policy "$RUNNER_TEMP/sandbox-policy.json" \
            --db "$RUNNER_TEMP/failure.sqlite" --workers 1 > "$RUNNER_TEMP/failure.json"
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "failure.json").read_text())
          assert result["state"] == "needs_review", result
          PY
          test -z "$(docker ps -aq --filter label=alpha.sandbox=agent-command)"
