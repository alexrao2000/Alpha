name: Agent runner checks
on:
  pull_request:
    paths:
      - 'alpha/worker_runtime.py'
      - 'alpha/guardrails.py'
      - 'test/guardrails_test.py'
      - 'alpha/cli.py'
      - 'test/worker_runtime_test.py'
      - '.github/workflows/agent-runner-tests.yml'
  push:
    branches: [main]
    paths:
      - 'alpha/worker_runtime.py'
      - 'alpha/guardrails.py'
      - 'test/guardrails_test.py'
      - 'alpha/cli.py'
      - 'test/worker_runtime_test.py'
      - '.github/workflows/agent-runner-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s test -p '*_test.py' -v
