[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-agent-lab"
version = "0.1.0"
description = "Measure the contribution of individual agent steps to completed work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
alpha = "alpha.cli:main"

[tool.setuptools]
packages = ["alpha"]
include-package-data = false

[tool.setuptools.package-data]
alpha = ["templates/*.html"]

[tool.setuptools.data-files]
"share/alpha-agent-lab" = ["fleet.config.json"]
"share/alpha-agent-lab/agent" = ["agent/instructions.md"]
"share/alpha-agent-lab/agent/subagents/planner" = ["agent/subagents/planner/instructions.md"]
"share/alpha-agent-lab/agent/subagents/policy" = ["agent/subagents/policy/instructions.md"]
"share/alpha-agent-lab/agent/subagents/researcher" = ["agent/subagents/researcher/instructions.md"]
"share/alpha-agent-lab/agent/subagents/resolver" = ["agent/subagents/resolver/instructions.md"]
"share/alpha-agent-lab/agent/subagents/reviewer" = ["agent/subagents/reviewer/instructions.md"]
"share/alpha-agent-lab/data" = ["data/cases.json"]
"share/alpha-agent-lab/integrations/crewai-game-builder" = ["integrations/crewai-game-builder/NOTICE", "integrations/crewai-game-builder/README.md", "integrations/crewai-game-builder/cases.json", "integrations/crewai-game-builder/fleet.config.json", "integrations/crewai-game-builder/grade.py", "integrations/crewai-game-builder/provenance.json", "integrations/crewai-game-builder/requirements.lock", "integrations/crewai-game-builder/requirements.txt", "integrations/crewai-game-builder/worker.py"]
"share/alpha-agent-lab/integrations/crewai-game-builder/upstream" = ["integrations/crewai-game-builder/upstream/README.md", "integrations/crewai-game-builder/upstream/pyproject.toml"]
"share/alpha-agent-lab/integrations/crewai-game-builder/upstream/src/game_builder_crew" = ["integrations/crewai-game-builder/upstream/src/game_builder_crew/__init__.py", "integrations/crewai-game-builder/upstream/src/game_builder_crew/crew.py"]
"share/alpha-agent-lab/integrations/crewai-game-builder/upstream/src/game_builder_crew/config" = ["integrations/crewai-game-builder/upstream/src/game_builder_crew/config/agents.yaml", "integrations/crewai-game-builder/upstream/src/game_builder_crew/config/tasks.yaml"]

"share/alpha-agent-lab/integrations/swarm-handoff" = ["integrations/swarm-handoff/README.md", "integrations/swarm-handoff/NOTICE", "integrations/swarm-handoff/adapter.json", "integrations/swarm-handoff/cases.json", "integrations/swarm-handoff/grader.py", "integrations/swarm-handoff/provenance.json", "integrations/swarm-handoff/worker.py"]
"share/alpha-agent-lab/integrations/swarm-handoff/upstream" = ["integrations/swarm-handoff/upstream/LICENSE", "integrations/swarm-handoff/upstream/README.md"]
"share/alpha-agent-lab/integrations/swarm-handoff/upstream/examples/basic" = ["integrations/swarm-handoff/upstream/examples/basic/agent_handoff.py"]
"share/alpha-agent-lab/integrations/swarm-handoff/upstream/swarm" = ["integrations/swarm-handoff/upstream/swarm/__init__.py", "integrations/swarm-handoff/upstream/swarm/core.py", "integrations/swarm-handoff/upstream/swarm/types.py", "integrations/swarm-handoff/upstream/swarm/util.py"]
"share/alpha-agent-lab/integrations/crewai-self-review" = ["integrations/crewai-self-review/README.md", "integrations/crewai-self-review/NOTICE", "integrations/crewai-self-review/adapter.json", "integrations/crewai-self-review/cases.json", "integrations/crewai-self-review/grader.py", "integrations/crewai-self-review/provenance.json", "integrations/crewai-self-review/worker.py"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/README.md"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/__init__.py", "integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/main.py"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/shakespeare_crew/config" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/shakespeare_crew/config/agents.yaml", "integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/shakespeare_crew/config/tasks.yaml"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/shakespeare_crew" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/shakespeare_crew/shakespeare_crew.py"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/x_post_review_crew/config" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/x_post_review_crew/config/agents.yaml", "integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/x_post_review_crew/config/tasks.yaml"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/x_post_review_crew" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/crews/x_post_review_crew/x_post_review_crew.py"]
"share/alpha-agent-lab/integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/tools" = ["integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/tools/CharacterCounterTool.py", "integrations/crewai-self-review/upstream/flows/self_evaluation_loop_flow/src/self_evaluation_loop_flow/tools/__init__.py"]
"share/alpha-agent-lab/examples/adapter" = ["examples/adapter/adapter.json", "examples/adapter/cases.json", "examples/adapter/grader.py", "examples/adapter/worker.py"]

"share/alpha-agent-lab/docs" = ["docs/adapters.md", "docs/experiments.md"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
